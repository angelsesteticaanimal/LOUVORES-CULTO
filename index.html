<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b1446">
<title>Louvores do Culto</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f0b2b;--card:#1d1650;--ac:#8b5cf6;--ac2:#38bdf8;--tx:#f1f0ff;--mu:#a9a4d6;--ok:#34d399;--er:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#0f0b2b,#1b1446);color:var(--tx);min-height:100vh}
header{padding:14px 16px;background:linear-gradient(90deg,var(--ac),var(--ac2));display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:18px}#st{font-size:12px;background:#0003;padding:3px 8px;border-radius:99px;text-align:right}
nav{display:flex;overflow-x:auto;gap:6px;padding:10px;position:sticky;top:0;background:#0f0b2bee;z-index:5}
nav button{flex:1 0 auto;white-space:nowrap;padding:10px 12px;border:0;border-radius:10px;background:var(--card);color:var(--mu);font-weight:600}
nav button.on{background:var(--ac);color:#fff}main{max-width:820px;margin:auto;padding:10px 14px 60px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;border:1px solid #ffffff14}
.tipo{font-size:13px;color:var(--ac2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.data{color:var(--mu);margin-bottom:10px;text-transform:capitalize}
.lv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff12;font-size:19px}.lv b{min-width:48px;color:var(--ac2)}
.obs{margin-top:12px;background:#0003;padding:12px;border-radius:12px;line-height:1.45}.obs h4{margin:0 0 6px;color:var(--ac2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.b,.row button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14px}
button.g{background:#ffffff1a}button.r{background:var(--er)}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff22;background:#0f0b2b;color:var(--tx);font-size:16px;margin:4px 0 10px;font-family:inherit}
label{font-size:13px;color:var(--mu)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lr{display:grid;grid-template-columns:70px 1fr auto auto auto;gap:6px;align-items:center}.lr input{margin:3px 0}.lr button{padding:8px 10px;border:0;border-radius:8px;background:#ffffff1a;color:#fff}
.vazio{text-align:center;color:var(--mu);padding:30px 10px}.msg{font-size:14px;min-height:20px;margin-top:8px}.pp{padding:10px 0;border-bottom:1px solid #ffffff12}.pp small{color:var(--mu)}
.card.full{position:fixed;inset:0;z-index:99;margin:0;border-radius:0;overflow:auto;padding:5vw;background:#000}
.card.full .lv{font-size:clamp(26px,5vw,64px);padding:1.4vw 0}.card.full .tipo{font-size:clamp(18px,3vw,34px)}.card.full .data{font-size:clamp(16px,2.4vw,26px)}
.card.full .obs{font-size:clamp(18px,3vw,34px)}.card.full .row{display:none}.fx{display:none}.card.full .fx{display:block;position:fixed;top:10px;right:10px}
details summary{cursor:pointer;padding:6px 0;font-weight:600}
.sg{display:flex;flex-direction:column;gap:6px;margin:2px 0 8px}.sg button{padding:9px 12px;border:0;border-radius:10px;background:#ffffff1a;color:#fff;text-align:left;font-size:14px}
.aut{font-size:12px;color:var(--mu);margin:-4px 0 10px}.card.full .aut{font-size:clamp(12px,1.6vw,18px)}.qb{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:8px 0}
.rel h4{margin:14px 0 6px;color:var(--ac2)}.rel .row{display:none}.rel p{margin:4px 0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff!important;color:#000!important}main{max-width:none;padding:0}.card{background:#fff!important;color:#000!important;border:1px solid #bbb;box-shadow:none}.lv b,.tipo,.obs h4,.rel h4{color:#000!important}.data,.aut{color:#444!important}.obs{background:#f2f2f2!important}}
</style></head><body>
<header><h1>🎵 Louvores do Culto <small>v3.3</small></h1><span id="st">Local</span></header>
<nav id="nav"></nav><main id="v"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js?v=30"></script>
<script src="louvores.js?v=1"></script>
<script>
const TIPOS=["Culto de Ceia","Culto das Senhoras","Culto de Oração","EBD","Vigília","Madrugada","Glorificação","Culto Padrão","Outro"];
const PAP={admin:"Líder",completo:"Completo",leitura:"Leitura"};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
const mkid=(d,t)=>(d+"_"+t).replace(/[^\w-]/g,"-");
const slug=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"");
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const CFG=typeof FIREBASE_CONFIG!=="undefined"?FIREBASE_CONFIG:(typeof firebaseConfig!=="undefined"?firebaseConfig:{});
const CHAVE_OK=/^AIza[\w-]{35}$/.test(String(CFG.apiKey||""));
const HAS=!!CFG.apiKey, FB=HAS&&typeof firebase!=="undefined";
let auth,db,user=null,ig=LS("lc_ig"),cand=null,pend=false,papel=HAS?null:"admin",unsub=[],qp=new URLSearchParams(location.search).get("igreja"),qk=new URLSearchParams(location.search).get("k"),qt=new URLSearchParams(location.search).get("t"),eu="",ch=null,qrT=null;
let cultos=HAS?{}:(LS("lc_cultos")||{}),pedidos={},membros={},tab="hoje",modo="in",rows=[{num:"",nome:""}],form={data:today(),tipo:TIPOS[0],hora:"",obs:""},msg="";
const canEdit=()=>papel=="admin"||papel=="completo";
const M=()=>msg?`<div class="msg" style="color:${msg[0]=="⚠"?"var(--er)":"var(--ok)"}">${esc(msg)}</div>`:'<div class="msg"></div>';
const link=()=>location.origin+location.pathname+"?igreja="+ig.id;
const col=()=>db.collection("igrejas").doc(ig.id).collection("cultos");
const dh=t=>t?new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const rk=()=>Array.from(crypto.getRandomValues(new Uint8Array(14)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
function errTxt(e){const c=e.code||"";if(/invalid-credential|wrong-password|user-not-found/.test(c))return"E-mail ou senha incorretos.";if(c.includes("email-already"))return"Este e-mail já está cadastrado.";if(c.includes("weak-password"))return"Senha fraca (mínimo 6 caracteres).";if(c.includes("invalid-email"))return"E-mail inválido.";if(c.includes("permission"))return"Sem permissão para esta ação.";return e.message||String(e)}
function init(){
 if(HAS&&!FB){$("#v").innerHTML='<div class="vazio">Sem conexão com o Firebase. Conecte-se à internet e recarregue.</div>';return}
 if(!HAS){draw();return}
 if(!firebase.apps.length)firebase.initializeApp(CFG);
 auth=firebase.auth();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 auth.onAuthStateChanged(u=>{user=u;if(!u){stop();papel=null;if(qp&&qk){auth.signInAnonymously().catch(e=>{msg="⚠ "+errTxt(e);draw()});return}draw();return}const q=qp||(ig&&ig.id);if(!u.isAnonymous)qp=null;if(q)join(q);else draw()});
}
function stop(){unsub.forEach(f=>f());unsub=[];cultos={};pedidos={};membros={};ch=null}
async function join(id){
 id=slug(id);if(!id)return;msg="";pend=false;
 try{const d=await db.collection("igrejas").doc(id).get();
  if(!d.exists){msg="⚠ Igreja não encontrada.";ig=null;cand=null;draw();return}
  const m=await db.doc(`igrejas/${id}/membros/${user.uid}`).get();
  if(m.exists){ig={id,nome:d.data().nome};papel=m.data().papel;eu=m.data().nome||user.displayName||user.email||"";LS("lc_ig",ig);cand=null;listen();draw();return}
  ig=null;cand={id,nome:d.data().nome};const p=user.isAnonymous?{exists:false}:await db.doc(`igrejas/${id}/pedidos/${user.uid}`).get();pend=p.exists;draw();
 }catch(e){msg="⚠ "+errTxt(e);draw()}}
function listen(){stop();const base=db.collection("igrejas").doc(ig.id);
 const er=e=>{if(e.code=="permission-denied"){stop();ig=null;papel=null;LS("lc_ig",null);msg="⚠ Você não tem mais acesso a esta igreja.";draw()}};
 unsub.push(base.collection("cultos").onSnapshot(s=>{const o={};s.forEach(d=>o[d.id]=d.data());cultos=o;redraw()},er));
 if(papel=="admin"){
  unsub.push(base.collection("pedidos").onSnapshot(s=>{pedidos={};s.forEach(d=>pedidos[d.id]=d.data());redraw()},er));
  unsub.push(base.collection("membros").onSnapshot(s=>{membros={};s.forEach(d=>membros[d.id]=d.data());redraw()},er));unsub.push(base.collection("segredos").doc("chaves").onSnapshot(d=>{ch=d.exists?d.data():null;redraw()},er))}}
function redraw(){if(tab=="edit"&&canEdit()){navDraw();return}draw()}
function navDraw(){
 const t=[["hoje","Hoje"],["hist","Histórico"]];if(canEdit())t.push(["edit","Editar"]);
 if(HAS&&papel=="admin"){const n=Object.keys(pedidos).length;t.push(["acc","Acessos"+(n?" ("+n+")":"")])}
 if(canEdit())t.push(["rel","Relatório"]);t.push(["cfg","Conta"]);if(!t.some(x=>x[0]==tab))tab="hoje";
 $("#nav").innerHTML=t.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';draw()">${n}</button>`).join("")}
function txt(c){return c.tipo+" — "+fmt(c.data)+(c.hora?" às "+c.hora:"")+"\n\n"+c.louvores.map(l=>(l.num?l.num+" - ":"")+l.nome+(l.col&&l.col!="Tradicional"?" ("+l.col+")":"")).join("\n")+(c.obs?"\n\nOrientações:\n"+c.obs:"")}
function card(c){return `<div class="card" id="c_${c.id}"><button class="b r fx" onclick="closeTv('${c.id}')">✕ Fechar</button><div class="tipo">${esc(c.tipo)}${c.hora?" · "+esc(c.hora):""}</div><div class="data">${fmt(c.data)}</div>${c.criadoPor?`<div class="aut">Criado por <b>${esc(c.criadoPor)}</b> em ${dh(c.criadoEm)}${c.editadoPor?` · Atualizado por <b>${esc(c.editadoPor)}</b> em ${dh(c.editadoEm)}`:""}</div>`:""}${c.louvores.map(l=>`<div class="lv"><b>${esc(l.num)}</b><span>${esc(l.nome)}${l.col&&l.col!="Tradicional"?` <small style="color:var(--mu)">(${esc(l.col)})</small>`:""}</span></div>`).join("")}${c.obs?`<div class="obs"><h4>Orientações</h4>${esc(c.obs).replace(/\n/g,"<br>")}</div>`:""}<div class="row"><button onclick="tv('${c.id}')">📺 Tela cheia</button><button onclick="wpp('${c.id}')">WhatsApp</button><button class="g" onclick="cp('${c.id}')">Copiar</button></div></div>`}
function tv(id){const e=$("#c_"+id);e.classList.add("full");try{e.requestFullscreen&&e.requestFullscreen()}catch(x){}}
function closeTv(id){$("#c_"+id).classList.remove("full");if(document.fullscreenElement)document.exitFullscreen()}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.querySelectorAll(".card.full").forEach(e=>e.classList.remove("full"))});
function wpp(id){window.open("https://wa.me/?text="+encodeURIComponent(txt(cultos[id])),"_blank")}
function cp(id){navigator.clipboard.writeText(txt(cultos[id])).then(()=>alert("Copiado!"))}
function list(){return Object.entries(cultos).map(([id,c])=>({...c,id})).sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora))}
function draw(){
 const v=$("#v");
 if(HAS){
  if(!user){$("#nav").innerHTML="";$("#st").textContent="Offline";if(qp&&qk&&!msg){$("#v").innerHTML='<div class="vazio">Conectando…</div>';return}return authView()}
  if(!ig||!papel){$("#nav").innerHTML="";if(user.isAnonymous)return anonView();$("#st").textContent=user.email;return igView()}
  $("#st").textContent=ig.nome+" · "+PAP[papel]}
 else $("#st").textContent="Local (só neste aparelho)";
 navDraw();
 if(tab=="hoje"){const l=list().filter(c=>c.data==today()).reverse();v.innerHTML=instBanner()+avisoRel()+(l.length?l.map(card).join(""):'<div class="vazio">Nenhum culto cadastrado para hoje.<br>Veja o <b>Histórico</b>.</div>')}
 else if(tab=="hist"){v.innerHTML='<input id="q" placeholder="🔎 Buscar louvor, número ou tipo de culto" oninput="hist()"><div id="hl"></div>';hist()}
 else if(tab=="edit")edit();
 else if(tab=="acc")accView();
 else if(tab=="rel")relView();
 else{cfgView();const vv=$("#v");if(vv.insertAdjacentHTML)vv.insertAdjacentHTML("beforeend",instBox())}
}
function hist(){const q=($("#q").value||"").toLowerCase();const l=list().filter(c=>!q||txt(c).toLowerCase().includes(q));
 $("#hl").innerHTML=l.length?l.map(c=>`<details class="card"><summary>${c.data.split("-").reverse().join("/")} · ${esc(c.tipo)} <small style="color:var(--mu)">(${c.louvores.length} louvores)</small></summary>${card(c)}</details>`).join(""):'<div class="vazio">Nada encontrado.</div>'}
/* ---- login / igreja ---- */
function authView(){$("#v").innerHTML=`<div class="card"><h3>${modo=="in"?"Entrar como líder":"Criar conta de líder"}</h3>${modo=="up"?'<label>Seu nome</label><input id="an">':""}<label>E-mail</label><input id="ae" type="email"><label>Senha</label><input id="as" type="password"><div class="row"><button onclick="doAuth()">${modo=="in"?"Entrar":"Criar conta"}</button><button class="g" onclick="modo=modo=='in'?'up':'in';msg='';authView()">${modo=="in"?"Criar conta":"Já tenho conta"}</button></div>${M()}</div><div class="card"><h3>Entrar só com o nome</h3><p style="font-size:14px;color:var(--mu)">Veio por QR Code ou link? Escaneie de novo ou cole o link aqui. Não precisa de e-mail nem senha.</p>${qp&&!qk?'<p style="color:var(--er);font-size:14px">⚠ Este link é antigo e não tem a chave de acesso. Peça ao líder o QR ou link novo (aba Acessos).</p>':""}<input id="lk" placeholder="Cole o link aqui"><button class="b" onclick="usaLink()">Entrar só com o nome</button><div id="lkmsg" class="msg" style="color:var(--er)"></div></div>${CHAVE_OK?"":`<p style="font-size:12px;color:var(--mu);word-break:break-all;margin:6px 4px">Diagnóstico — projeto: <b>${esc(CFG.projectId)}</b><br>chave (${String(CFG.apiKey).length} caracteres): <b style="color:${CHAVE_OK?"var(--ok)":"var(--er)"}">${CHAVE_OK?"formato OK ✓":"⚠ inválida: deve começar com AIza e ter 39 caracteres"}</b><br><code style="font-size:15px;color:var(--tx)">${esc(CFG.apiKey)}</code></p>`}`}
async function doAuth(){const e=$("#ae").value.trim(),p=$("#as").value,n=$("#an")?$("#an").value.trim():"";try{if(modo=="up"){const c=await auth.createUserWithEmailAndPassword(e,p);try{await c.user.updateProfile({displayName:n})}catch(x){}}else await auth.signInWithEmailAndPassword(e,p);msg=""}catch(x){msg="⚠ "+errTxt(x);if(user)draw();else authView()}}
function anonView(){const c=cand;$("#st").textContent="Entrar com nome";$("#v").innerHTML=c&&qk?`<div class="card"><h3>${esc(c.nome)}</h3><p style="color:var(--mu)">Digite seu nome para entrar ${qt=="e"?"(você poderá ver e editar)":"(você poderá ver os cultos)"}.</p><label>Seu nome</label><input id="nm" value="${esc(LS("lc_nome")||"")}" autocomplete="name"><button class="b" onclick="entra()">Entrar</button>${M()}</div>`:`<div class="card"><h3>Entrar por QR Code ou link</h3><p style="color:var(--mu)">Abra o link ou escaneie o QR Code que o líder da igreja enviou.</p>${M()}</div>`}
async function entra(){const n=$("#nm").value.trim();if(n.length<2){msg="⚠ Digite seu nome.";anonView();return}LS("lc_nome",n);try{const ps=qt=="e"?["completo"]:qt=="l"?["leitura"]:["leitura","completo"];let ok=false;for(const p of ps){try{await db.doc(`igrejas/${cand.id}/membros/${user.uid}`).set({nome:n,papel:p,chave:qk,entrou:Date.now()});ok=true;break}catch(e){}}if(!ok)throw 0;msg="";await join(cand.id)}catch(e){msg="⚠ Link inválido ou antigo. Peça um novo ao líder.";anonView()}}
function igView(){const c=cand;$("#v").innerHTML=`<div class="card"><h3>Entrar na sua igreja</h3><label>Código da igreja</label><input id="ic" value="${esc(c?c.id:"")}" placeholder="ex.: igreja-central-rj"><button class="b" onclick="join($('#ic').value)">Continuar</button>${c?(pend?'<p>⏳ Pedido enviado. Aguarde o líder liberar seu acesso.</p><button class="g b" onclick="join(cand.id)">Verificar novamente</button>':`<p>Igreja encontrada: <b>${esc(c.nome)}</b></p><button class="b" onclick="pedir()">Solicitar acesso</button>`):""}${M()}</div>
<div class="card"><h3>Cadastrar minha igreja</h3><label>Nome da igreja</label><input id="cn"><label>Código (letras minúsculas, números e hífen)</label><input id="cc" placeholder="igreja-central-rj"><button class="b" onclick="criaIg()">Cadastrar e ser o líder</button></div>
<div class="row"><button class="g" onclick="auth.signOut()">Sair (${esc(user.email)})</button></div>`}
async function pedir(){try{await db.doc(`igrejas/${cand.id}/pedidos/${user.uid}`).set({email:user.email,nome:user.displayName||user.email,data:Date.now()});pend=true;msg="";igView()}catch(e){msg="⚠ "+errTxt(e);igView()}}
async function criaIg(){const nome=$("#cn").value.trim(),id=slug($("#cc").value);
 if(!nome||id.length<3){msg="⚠ Informe o nome e um código com ao menos 3 caracteres.";igView();return}
 try{if((await db.doc("igrejas/"+id).get()).exists){msg="⚠ Este código já existe. Escolha outro.";igView();return}
  await db.doc("igrejas/"+id).set({nome,dono:user.uid,criado:Date.now()});
  await db.doc(`igrejas/${id}/membros/${user.uid}`).set({email:user.email,nome:user.displayName||user.email,papel:"admin"});
  await db.doc(`igrejas/${id}/segredos/chaves`).set({leitura:rk(),edicao:rk()});
  join(id)}catch(e){msg="⚠ "+errTxt(e);igView()}}
/* ---- acessos (líder) ---- */
function accView(){const pl=Object.entries(pedidos),ml=Object.entries(membros);
 $("#v").innerHTML=`<div class="card"><h3>Acesso por QR Code ou link (só o nome)</h3>${ch?`<p style="color:var(--mu);font-size:14px">Quem abrir o link digita só o nome e entra. Nos cultos aparece quem criou e quem editou.</p>${["l","e"].map(t=>`<div class="pp"><b>${t=="l"?"Somente ver":"Ver e editar"}</b><br><small style="word-break:break-all">${esc(lk(t))}</small><div class="row"><button onclick="navigator.clipboard.writeText(lk('${t}')).then(()=>alert('Link copiado!'))">Copiar link</button><button class="g" onclick="qrT=qrT=='${t}'?null:'${t}';accView()">${qrT==t?"Ocultar QR":"Mostrar QR"}</button></div>${qrT==t?'<div class="qb" id="qrbox"></div>':""}</div>`).join("")}<div class="row"><button class="g" onclick="novasChaves()">Gerar novos links</button></div>`:`<p style="color:var(--mu)">Ainda não há links de acesso.</p><button class="b" onclick="novasChaves()">Gerar links de acesso</button>`}${M()}</div><div class="card"><h3>Entrada com e-mail (opcional)</h3><p style="word-break:break-all">${esc(link())}</p><p>Código: <b>${esc(ig.id)}</b></p><button class="b" onclick="navigator.clipboard.writeText(link()).then(()=>alert('Link copiado!'))">Copiar link</button></div>
<div class="card"><h3>Pedidos de acesso</h3>${pl.length?pl.map(([u,p])=>`<div class="pp"><b>${esc(p.nome)}</b><br><small>${esc(p.email)}</small><div class="row"><button onclick="aprova('${u}','completo')">Completo</button><button class="g" onclick="aprova('${u}','leitura')">Leitura</button><button class="r" onclick="recusa('${u}')">Recusar</button></div></div>`).join(""):'<div class="vazio">Nenhum pedido pendente.</div>'}</div>
<div class="card"><h3>Pessoas com acesso</h3>${ml.map(([u,m])=>`<div class="pp"><b>${esc(m.nome||m.email)}</b><br><small>${esc(m.email||"entrou por link")}</small>${u==user.uid?"<br><small>Você (líder)</small>":`<div class="row"><select onchange="muda('${u}',this.value)">${Object.keys(PAP).map(p=>`<option value="${p}" ${p==m.papel?"selected":""}>${PAP[p]}</option>`).join("")}</select><button class="r" onclick="rem('${u}')">Remover</button></div>`}</div>`).join("")}${M()}</div>`;
 if(qrT&&window.QRCode&&ch){const b=$("#qrbox");if(b){b.innerHTML="";new QRCode(b,{text:lk(qrT),width:220,height:220})}}}
const lk=t=>location.origin+location.pathname+"?igreja="+ig.id+"&t="+t+"&k="+ch[t=="e"?"edicao":"leitura"];
async function novasChaves(){if(ch&&!confirm("Os links antigos deixam de funcionar para novas entradas. Continuar?"))return;try{await db.doc(`igrejas/${ig.id}/segredos/chaves`).set({leitura:rk(),edicao:rk()});msg="Links gerados ✓"}catch(e){msg="⚠ "+errTxt(e)}accView()}
const mref=u=>db.doc(`igrejas/${ig.id}/membros/${u}`),pref=u=>db.doc(`igrejas/${ig.id}/pedidos/${u}`);
async function aprova(u,p){const q=pedidos[u];try{const b=db.batch();b.set(mref(u),{email:q.email,nome:q.nome,papel:p});b.delete(pref(u));await b.commit();msg="Acesso liberado ✓"}catch(e){msg="⚠ "+errTxt(e)}accView()}

/* ---- editar ---- */
function edit(){
 $("#v").innerHTML=`<div class="card"><div class="g2"><div><label>Data</label><input type="date" id="fd" value="${form.data}" onchange="chg()"></div><div><label>Tipo de culto</label><select id="ft" onchange="chg()">${TIPOS.map(t=>`<option ${t==form.tipo?"selected":""}>${t}</option>`).join("")}</select></div></div>
 <label>Horário (opcional)</label><input id="fh" value="${esc(form.hora)}" placeholder="19:30">
 <label>Louvores (número e nome)</label><div id="rw"></div><button class="g b" onclick="addRow()">+ Louvor</button>
 <details style="margin-top:10px"><summary>Colar lista de uma vez</summary><textarea id="ti" rows="5" placeholder="422 - A Minha Herança&#10;3 - Clamo a Ti"></textarea><button class="g b" onclick="imp()">Importar</button></details>
 <label style="display:block;margin-top:10px">Orientações para o culto</label><textarea id="fo" rows="5" placeholder="Horário de chegada, quem dirige, avisos...">${esc(form.obs)}</textarea>
 <div class="row"><button onclick="save()">💾 Salvar culto</button><button class="g" onclick="del()">Excluir</button><button class="g" onclick="clr()">Limpar</button></div>${M()}</div>`;rr()}
function sync(){form.hora=$("#fh").value;form.obs=$("#fo").value}
function rr(){$("#rw").innerHTML=rows.map((r,i)=>`<div><div class="lr"><input value="${esc(r.num)}" placeholder="Nº" inputmode="numeric" oninput="rows[${i}].num=this.value;busca(${i})"><input id="nm${i}" value="${esc(r.nome)}" placeholder="Nome do louvor" oninput="rows[${i}].nome=this.value;rows[${i}].auto=false;rows[${i}].col=''"><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button><button onclick="rows.splice(${i},1);rr()">✕</button></div><div class="sg" id="sg${i}"></div></div>`).join("")}
function indice(){if(window._ix)return window._ix;const ix={},L=window.LOUVORES||{};Object.keys(L).forEach(c=>L[c].split("\n").forEach(l=>{const p=l.indexOf("|");if(p<1)return;const n=String(parseInt(l.slice(0,p),10));(ix[n]=ix[n]||[]).push({col:c,nome:l.slice(p+1).trim()})}));return window._ix=ix}
function busca(i){const r0=rows[i],box=$("#sg"+i),inp=$("#nm"+i);if(!box)return;if(r0.nome&&!r0.auto){box.innerHTML="";return}
 const v=(r0.num||"").trim(),r=v?(indice()[String(parseInt(v,10))]||[]):[];
 if(r.length!=1&&r0.auto){r0.nome="";r0.col="";r0.auto=false;if(inp)inp.value=""}
 if(r.length==1){r0.nome=r[0].nome;r0.col=r[0].col;r0.auto=true;if(inp)inp.value=r[0].nome;box.innerHTML="";return}
 box.innerHTML=r.map((x,k)=>`<button onclick="pick(${i},${k})">${esc(x.col)}: ${esc(x.nome)}</button>`).join("")}
function pick(i,k){const r=indice()[String(parseInt(rows[i].num,10))]||[];if(!r[k])return;rows[i].nome=r[k].nome;rows[i].col=r[k].col;rows[i].auto=true;$("#nm"+i).value=r[k].nome;$("#sg"+i).innerHTML=""}
function addRow(){rows.push({num:"",nome:""});rr()}
function mv(i,d){const j=i+d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];rr()}
function imp(){$("#ti").value.split("\n").map(s=>s.trim()).filter(Boolean).forEach(s=>{if(/^\d+$/.test(s)){rows.push({num:s,nome:""});return}const m=s.match(/^(\d+)\s*[-–.:)]?\s*(.+)$/);rows.push(m?{num:m[1],nome:m[2]}:{num:"",nome:s})});rows=rows.filter(r=>r.num||r.nome);$("#ti").value="";rr();rows.forEach((r,i)=>busca(i))}
function chg(){sync();form.data=$("#fd").value;form.tipo=$("#ft").value;const c=cultos[mkid(form.data,form.tipo)];if(c){rows=c.louvores.map(l=>({...l}));form.hora=c.hora||"";form.obs=c.obs||"";msg="Culto existente carregado."}else msg="";edit()}
async function save(){sync();const l=rows.filter(r=>r.num.trim()||r.nome.trim()).map(r=>{const x={num:r.num.trim(),nome:r.nome.trim()};if(r.col)x.col=r.col;return x});if(!l.length){alert("Adicione ao menos um louvor.");return}
 const now=Date.now(),id=mkid(form.data,form.tipo),old=cultos[id],o={data:form.data,tipo:form.tipo,hora:form.hora,obs:form.obs,louvores:l,upd:now,criadoPor:(old&&old.criadoPor)||eu||"Local",criadoEm:(old&&old.criadoEm)||now};if(old){o.editadoPor=eu||"Local";o.editadoEm=now}
 try{if(db)await col().doc(id).set(o);else{cultos[id]=o;LS("lc_cultos",cultos)}msg="Salvo ✓"}catch(e){msg="⚠ "+errTxt(e)}edit()}
async function del(){const id=mkid(form.data,form.tipo);if(!cultos[id]||!confirm("Excluir este culto?"))return;try{if(db)await col().doc(id).delete();else{delete cultos[id];LS("lc_cultos",cultos)}msg="Excluído.";rows=[{num:"",nome:""}];form.obs="";form.hora=""}catch(e){msg="⚠ "+errTxt(e)}edit()}
function clr(){rows=[{num:"",nome:""}];form.obs="";form.hora="";msg="";edit()}
/* ---- conta ---- */
function cfgView(){$("#v").innerHTML=HAS?`<div class="card"><h3>Minha conta</h3><p>${esc(eu)}<br><small style="color:var(--mu)">${esc(user.email||"Acesso por link")}</small></p><p>Igreja: <b>${esc(ig.nome)}</b> (${esc(ig.id)})<br>Acesso: <b>${PAP[papel]}</b></p><div class="row"><button class="g" onclick="stop();ig=null;papel=null;cand=null;LS('lc_ig',null);draw()">Trocar de igreja</button><button class="r" onclick="stop();LS('lc_ig',null);auth.signOut()">Sair</button></div></div>`:`<div class="card"><h3>Modo local</h3><p style="color:var(--mu)">Os dados ficam só neste aparelho. Para várias pessoas e várias igrejas, crie o arquivo config.js com o firebaseConfig do seu projeto.</p></div>`}

async function instalar(){if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;draw()}}
function instBanner(){if(standalone()||LS("lc_inst"))return"";return `<div class="card" style="border-color:var(--ac)"><b>📲 Instale o app no seu aparelho</b><p style="color:var(--mu);font-size:14px">Abre direto da tela inicial, sem digitar nada.</p>${dip?'<div class="row"><button onclick="instalar()">Instalar app</button><button class="g" onclick="LS(\'lc_inst\',1);draw()">Agora não</button></div>':`<p style="font-size:14px">${instTxt()}</p><div class="row"><button class="g" onclick="LS('lc_inst',1);draw()">Entendi</button></div>`}</div>`}
function instBox(){return `<div class="card"><h3>Instalar o app</h3>${standalone()?"<p>✓ O app já está instalado neste aparelho.</p>":(dip?'<button class="b" onclick="instalar()">Instalar app</button>':`<p style="color:var(--mu)">${instTxt()}</p>`)}</div>`}
function usaLink(){const box=$("#lkmsg"),say=t=>{if(box)box.textContent=t},raw=($("#lk").value||"").trim(),m=raw.match(/https?:\/\/[^\s]+/i);
 if(!m){say("⚠ Cole o link completo (começa com https://).");return}
 let p;try{p=new URL(m[0]).searchParams}catch(e){say("⚠ Link inválido. Cole o link completo que o líder enviou.");return}
 if(!p.get("igreja")){say("⚠ Este link não é de uma igreja. Peça o link ao líder (aba Acessos).");return}
 if(!p.get("k")){say("⚠ Este link é antigo: falta a chave de acesso. Peça ao líder o link novo de Somente ver ou Ver e editar (aba Acessos).");return}
 qp=p.get("igreja");qk=p.get("k");qt=p.get("t");msg="";say("Conectando…");
 if(user)join(qp);else auth.signInAnonymously().catch(e=>say("⚠ "+errTxt(e)))}
/* ---- relatório mensal ---- */
const mesNome=m=>new Date(m+"-01T12:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
function avisoRel(){if(!canEdit()||new Date().getDate()>7)return"";const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const m=d.toLocaleDateString("en-CA").slice(0,7);return `<div class="card" style="border-color:var(--ac2)"><b>📄 Relatório de ${esc(mesNome(m))} disponível</b><div class="row"><button onclick="rm='${m}';tab='rel';draw()">Abrir relatório</button></div></div>`}
function relDados(m){const cs=list().filter(c=>c.data.startsWith(m)).sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||""))),tipos={},lv={},pes={};let tot=0;
 const P=n=>pes[n]||(pes[n]={c:0,e:0});
 cs.forEach(c=>{tipos[c.tipo]=(tipos[c.tipo]||0)+1;c.louvores.forEach(l=>{tot++;const k=(l.num||"")+"|"+(l.col||"")+"|"+l.nome;(lv[k]=lv[k]||{num:l.num||"",col:l.col||"",nome:l.nome,n:0}).n++});P(c.criadoPor||"(não informado)").c++;if(c.editadoPor)P(c.editadoPor).e++});
 const top=Object.values(lv).sort((a,b)=>b.n-a.n||String(a.num).localeCompare(String(b.num),"pt",{numeric:true}));
 return{cs,tipos,tot,top,pes,dif:top.length}}
function relView(){const m=rm,d=relDados(m);
 $("#v").innerHTML=`<div class="card noprint"><label>Mês do relatório</label><input type="month" value="${m}" onchange="rm=this.value||rm;relView()"><div class="row"><button onclick="window.print()">🖨️ Imprimir / PDF</button><button onclick="relXlsx()">📊 Excel</button><button onclick="relWpp()">WhatsApp</button><button class="g" onclick="relMail()">E-mail</button></div></div>
<div class="card rel"><h2 style="margin:0 0 4px">Relatório de ${esc(mesNome(m))}</h2><div class="data">${esc(ig?ig.nome:"")}</div>${d.cs.length?`<h4>Resumo</h4><p>Cultos: <b>${d.cs.length}</b> · Louvores cantados: <b>${d.tot}</b> · Louvores diferentes: <b>${d.dif}</b></p><p>${Object.entries(d.tipos).map(([t,n])=>esc(t)+": <b>"+n+"</b>").join(" · ")}</p>
<h4>Louvores mais usados</h4>${d.top.slice(0,10).map(x=>`<div class="lv"><b>${esc(x.num)}</b><span>${esc(x.nome)}${x.col&&x.col!="Tradicional"?" ("+esc(x.col)+")":""} — ${x.n}x</span></div>`).join("")}
<h4>Quem cadastrou e editou</h4>${Object.entries(d.pes).map(([p,v])=>`<p>${esc(p)}: cadastrou <b>${v.c}</b> · editou <b>${v.e}</b></p>`).join("")}
<h4>Cultos do mês</h4>${d.cs.map(card).join("")}`:'<div class="vazio">Nenhum culto cadastrado neste mês.</div>'}</div>`}
function relRows(d){return{resumo:[["Indicador","Valor"],["Cultos",d.cs.length],["Louvores cantados",d.tot],["Louvores diferentes",d.dif],...Object.entries(d.tipos).map(([t,n])=>["Cultos - "+t,n])],
 cultos:[["Data","Tipo","Horário","Nº","Louvor","Coletânea","Orientações","Criado por","Criado em","Atualizado por","Atualizado em"],...d.cs.flatMap(c=>c.louvores.map((l,i)=>[c.data,c.tipo,c.hora||"",l.num||"",l.nome,l.col||"Tradicional",i?"":(c.obs||""),c.criadoPor||"",dh(c.criadoEm),c.editadoPor||"",dh(c.editadoEm)]))],
 louvores:[["Nº","Louvor","Coletânea","Vezes"],...d.top.map(x=>[x.num,x.nome,x.col||"Tradicional",x.n])],
 pessoas:[["Pessoa","Cultos cadastrados","Cultos editados"],...Object.entries(d.pes).map(([p,v])=>[p,v.c,v.e])]}}
function relXlsx(){const d=relDados(rm),r=relRows(d),nome="relatorio-"+(ig?ig.id:"culto")+"-"+rm;
 if(window.XLSX){const wb=XLSX.utils.book_new();[["Resumo",r.resumo],["Cultos",r.cultos],["Louvores",r.louvores],["Pessoas",r.pessoas]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));XLSX.writeFile(wb,nome+".xlsx");return}
 const csv="\ufeff"+r.cultos.map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=nome+".csv";a.click()}
function relTxt(){const d=relDados(rm);return "*Relatório de "+mesNome(rm)+"* — "+(ig?ig.nome:"")+"\nCultos: "+d.cs.length+" | Louvores cantados: "+d.tot+" | Diferentes: "+d.dif+"\n"+Object.entries(d.tipos).map(([t,n])=>t+": "+n).join("\n")+"\n\nMais usados:\n"+d.top.slice(0,10).map((x,i)=>(i+1)+". "+x.num+" - "+x.nome+" ("+x.n+"x)").join("\n")+"\n\nQuem registrou:\n"+Object.entries(d.pes).map(([p,v])=>p+": cadastrou "+v.c+", editou "+v.e).join("\n")}
function relWpp(){window.open("https://wa.me/?text="+encodeURIComponent(relTxt()),"_blank")}
function relMail(){location.href="mailto:?subject="+encodeURIComponent("Relatório de louvores - "+mesNome(rm))+"&body="+encodeURIComponent(relTxt())}

init();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
